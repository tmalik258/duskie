id: clipboard.format-json
name: Format copied JSON
description: Pretty-print JSON on the clipboard.
priority: 30
trigger:
  event: clipboard.changed
  where:
    kind: { equals: json }
suggestion:
  title: "JSON copied"
  detail: "{{length}} characters"
  options:
    - { label: Format JSON, action: format_json_clipboard }
    - { label: Minify JSON, action: format_json_clipboard, args: { minify: "true" } }
